<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Informasi Wisudawan</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            overflow: hidden;
            /* Mencegah pemantulan scroll berlebih di iOS */
            position: fixed; 
        }

        .app-container {
            position: relative;
            width: 100%;
            /* Menggunakan dvh (Dynamic Viewport Height) agar pas dengan address bar HP */
            height: 100vh;
            height: 100dvh; 
            max-width: 100%;
        }

        .app-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbzogZDRr1oxHpRUH0_Fq2F1pC5Q8vFNDLGJnsCh674U58ZTqkpW16x0zeMBqDRlIEw7/exec"
            allow="geolocation; microphone; camera; clipboard-write"
            sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
        </iframe>
    </div>

</body>
</html>
